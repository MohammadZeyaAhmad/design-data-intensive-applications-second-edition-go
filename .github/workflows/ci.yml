name: Go Atlas reference
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-disposable-only
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas-ci-disposable-only@127.0.0.1:5432/atlas_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.sum
            labs/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l cmd contracts internal migrations tests api labs benchmarks)"
      - name: Reproduce pinned sqlc catalog mappings
        run: make check-catalog-generated
      - name: Reproduce pinned Protobuf and Thrift contracts and reserved-field rejection
        run: make check-encoding-generated
      - name: Reproduce pinned Inventory gRPC and OpenAPI contracts
        run: make check-rpc-generated
      - name: Reproduce bounded Avro structs and embedded immutable schemas
        run: make check-avro-generated
      - name: Application and lab tests, including race detection
        run: make test
      - name: Real PostgreSQL concurrency and failure tests
        run: make integration
      - name: Source inventory and executable storage comparisons
        run: make coverage-check lab models-demo graph-demo semantic-demo storage-demo btree-demo index-demo tradeoffs-demo column-demo search-demo query-plans storage-bench
      - name: Catalog cache authority, overload drain, bounded provider retries and real Redis fences
        run: make resilience-postgres cache-demo integration-redis
      - name: Native checkout traces, private metrics, actual Prometheus alerts and SLI rules
        run: make observability-tools observability-postgres observability-prometheus observability-rules
      - name: Checked release binaries, build-info SBOMs and immutable deployment references
        run: |
          ATLAS_RELEASE_REQUIRE_CLEAN=true make release-artifacts
          make deployment-reference-check
          bash tools/terraform-reference-check.sh
      - name: Real catalog model queries, plans and ORM comparison
        run: make models-postgres
      - name: GraphQL composition, native batching and REST parity
        run: make graphql-demo graphql-postgres
      - name: Encoding versions, generated RPC and repeated byte/CPU comparisons
        run: make encoding-demo encoding-bench
      - name: Avro schema resolution, fingerprint lookup and immutable OCF replay
        run: make avro-demo
      - name: Real historical/current Atlas rolling migration, process crash and rollback
        run: make evolution-demo
      - name: Real REST/gRPC, discovery, lost reply and in-flight backend SIGKILL
        run: make rpc-demo
      - name: Actor supervision, remote process loss and transactional PostgreSQL receipts
        run: make check-actors-contracts actors-postgres actors-demo
      - name: Real pgvector profile, exact recall and search application tests
        run: make integration-search-vector
      - name: Real graph SQL and Neo4j profile, tenant fences and bounded paths
        run: make integration-graph
      - name: Real RDF and SPARQL, recursive SQL and positive Datalog parity
        run: make integration-semantic
      - name: Bounded RDF interchange and Datalog grammar fuzzing
        run: |
          cd labs
          go test -run '^$' -fuzz '^FuzzNTriplesRoundTrip$' -fuzztime=5s -parallel=2 ./ch03/semantic-graph/rdf
          go test -run '^$' -fuzz '^FuzzPositiveProgram$' -fuzztime=5s -parallel=2 ./ch03/semantic-graph/datalog
      - name: Bounded storage record fuzzing
        run: cd labs && go test -run '^$' -fuzz '^FuzzRecordDecoder$' -fuzztime=5s -parallel=2 ./ch04/lsm
      - name: Bounded B+ tree page and redo fuzzing
        run: |
          cd labs
          go test -run '^$' -fuzz '^FuzzPageDecoder$' -fuzztime=5s -parallel=2 ./ch04/btree
          go test -run '^$' -fuzz '^FuzzRedoDecoder$' -fuzztime=5s -parallel=2 ./ch04/btree
      - name: Bounded column, segment and expression fuzzing
        run: |
          cd labs
          go test -run '^$' -fuzz '^FuzzColumnDecoder$' -fuzztime=5s -parallel=2 ./ch04/columnstore
          go test -run '^$' -fuzz '^FuzzSegmentDecoder$' -fuzztime=5s -parallel=2 ./ch04/columnstore
          go test -run '^$' -fuzz '^FuzzExpressionParser$' -fuzztime=5s -parallel=2 ./ch04/columnstore
      - name: Bounded search tokenization and numeric fuzzing
        run: cd labs && go test -run '^$' -fuzz '^FuzzTokenizerAndCosineBounds$' -fuzztime=5s -parallel=2 ./ch04/search
      - name: Bounded model schema migration fuzzing
        run: cd labs && go test -run '^$' -fuzz '^FuzzSchemaOnRead$' -fuzztime=5s -parallel=2 ./ch03/models
      - name: Bounded graph scalar properties and traversal inputs
        run: cd labs && go test -run '^$' -fuzz '^FuzzPropertiesAndBounds$' -fuzztime=5s -parallel=2 ./ch03/property-graph
      - name: Bounded GraphQL query cost and fragment expansion fuzzing
        run: go test -run '^$' -fuzz '^FuzzQueryBudget$' -fuzztime=5s -parallel=2 ./api/graphql
      - name: Bounded encoding wire preflight fuzzing
        run: cd labs && go test -run '^$' -fuzz '^FuzzWirePreflight$' -fuzztime=5s -parallel=2 ./ch05/encoding
      - name: Bounded actor message and version preflight fuzzing
        run: cd labs && go test -run '^$' -fuzz '^FuzzMessagePreflight$' -fuzztime=5s -parallel=2 ./ch05/actors
      - name: Bounded Avro datum and container schema fuzzing
        run: |
          cd labs
          go test -run '^$' -fuzz '^FuzzBoundedAvro$' -fuzztime=5s -parallel=2 ./ch05/avro
          go test -run '^$' -fuzz '^FuzzBoundedContainer$' -fuzztime=5s -fuzzminimizetime=100ms -parallel=2 ./ch05/avro
      - name: Bounded versioned Catalog history upcasting
        run: |
          go test -run '^$' -fuzz '^FuzzBrandHistory$' -fuzztime=5s -parallel=2 ./contracts/catalog
          go test -run '^$' -fuzz '^FuzzBrandArchive$' -fuzztime=5s -fuzzminimizetime=100ms -parallel=2 ./contracts/catalog
      - name: Retain storage comparison report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-comparison
          path: |
            artifacts/operations/*.json
            artifacts/release/atlas-*.tar.gz
            artifacts/resilience-postgres.json
            artifacts/resilience-redis.json
            artifacts/cache-comparison.json
            artifacts/storage.json
            artifacts/btree.json
            artifacts/indexes.json
            artifacts/tradeoffs.json
            artifacts/query-plans.json
            artifacts/storage-go-benchmark.txt
            artifacts/columnstore.json
            artifacts/search.json
            artifacts/search-pgvector.json
            artifacts/models.json
            artifacts/models-postgres.json
            artifacts/graph.json
            artifacts/graph-services.json
            artifacts/semantic.json
            artifacts/semantic-services.json
            artifacts/graphql.json
            artifacts/graphql-postgres.json
            artifacts/encoding.json
            artifacts/encoding-go-benchmark.txt
            artifacts/avro.json
            artifacts/avro-archives-*
            artifacts/evolution.json
            artifacts/evolution-run-*
            artifacts/evolution-binaries/manifest.json
            artifacts/rpc.json
            artifacts/rpc-run-*
            artifacts/rpc-binaries/manifest.json
            artifacts/actors.json
            artifacts/actors-broker.json
            artifacts/actors-run-*
            artifacts/actors-binaries/manifest.json
      - name: Verify application builds independently of the lab workspace
        run: |
          GOWORK=off go build ./cmd/atlas ./cmd/guide ./cmd/admin ./cmd/schema ./cmd/router ./cmd/loadgen ./cmd/releasecheck
          cd labs && GOWORK=off go build -o ../artifacts/lab-standalone ./cmd/lab
      - name: Start disposable API and worker stack
        run: make up
      - name: Live HTTP contention and restart recovery
        run: make verify-live verify-lifecycle verify-orders verify-checkout verify-checkout-recovery verify-fulfillment verify-fulfillment-recovery verify-operations verify-recovery verify-search-live verify-models-live verify-graphql-live
      - name: Real Redis outage, unchanged API process and finite HTTP load
        run: |
          make up-resilience verify-resilience-live
          make restore-default-cache
      - name: Retain cache outage and bounded load observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resilience-recovery
          path: |
            artifacts/resilience-live.json
            artifacts/resilience-load.json
      - name: Actual private Prometheus, Grafana and Jaeger observation profile
        run: |
          make up-observe verify-observe-live
          make restore-default-observe
      - name: Retain observation profile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observation-profile
          path: artifacts/operations-live.json
      - name: Local routing containers and shared REST/gRPC command receipts
        run: |
          make up-routing verify-rpc-live
          make down-routing
      - name: Start Kafka transport profile
        run: make up-kafka
      - name: Kafka transport and existing business flows
        run: |
          make verify-kafka
          ATLAS_MESSAGE_TRANSPORT=kafka make verify-live verify-orders verify-checkout verify-fulfillment verify-operations verify-graphql-live
      - name: Real Kafka acknowledgments and group rebalance
        run: make integration-kafka
      - name: Real Kafka actor redelivery, competing consumers, fan-out and request/reply
        run: make integration-actors
      - name: Retain actor broker recovery report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actor-broker-recovery
          path: |
            artifacts/actors-broker.json
            artifacts/actors-run-*
            artifacts/actors-binaries/manifest.json
      - name: Start Temporal checkout profile
        run: |
          make down-kafka
          make up-temporal
      - name: Temporal checkout business flows and container recovery
        run: |
          ATLAS_CHECKOUT_ENGINE=temporal make verify-live verify-lifecycle verify-orders verify-checkout verify-checkout-recovery verify-fulfillment verify-fulfillment-recovery verify-operations verify-recovery verify-graphql-live
          make verify-temporal
      - name: Real Temporal activities, native cancellation and old-history replay
        run: make integration-temporal
      - name: Search vector application profile and live stale-embedding recovery
        run: |
          make down-temporal
          make up-search
          ATLAS_SEARCH_VECTOR_ENABLED=true make verify-search-live
          make down-search
      - name: Stop disposable stack
        if: always()
        run: |
          if test -f .env; then make down-observe down-redis-test down-resilience down-actors down-routing down-rdf down-graph down-search-test down-search down-temporal-test down-kafka-test down-temporal down-kafka; fi
