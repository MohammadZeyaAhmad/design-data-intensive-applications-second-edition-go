syntax = "proto3";
// Frozen original contract. Generate only a private descriptor set: registering
// this and the current definition globally would duplicate message identities.
package atlas.inventory.v1;
service Inventory {
  rpc Reserve(ReserveRequest) returns (ReservationReply);
  rpc GetReservation(GetReservationRequest) returns (Reservation);
}
message ReserveRequest {
  string idempotency_key = 1;
  string sku = 2;
  int64 quantity = 3;
  int64 ttl_seconds = 4;
}
message GetReservationRequest { string id = 1; }
message Reservation {
  string id = 1;
  string tenant_id = 2;
  string sku = 3;
  int64 quantity = 4;
  string status = 5;
  int64 version = 6;
  int64 expires_at_unix_ms = 7;
}
message Stock {
  string tenant_id = 1;
  string sku = 2;
  int64 on_hand = 3;
  int64 reserved = 4;
  int64 allocated = 5;
  int64 version = 6;
}
message ReservationReply {
  Reservation reservation = 1;
  Stock stock = 2;
}
