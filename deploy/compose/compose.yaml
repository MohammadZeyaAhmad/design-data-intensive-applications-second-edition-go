name: ddia-go

x-app: &app
  image: ddia-go-atlas:dev
  build:
    context: ../..
    dockerfile: Dockerfile
  environment: &environment
    ATLAS_DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:?run make configure}@postgres:5432/atlas_dev?sslmode=disable
    NO_PROXY: postgres,api,localhost,127.0.0.1
  init: true
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make configure}
      POSTGRES_DB: atlas_dev
    ports: ["127.0.0.1:15433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U atlas -d atlas_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: [migrate]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    command: [serve]
    environment:
      <<: *environment
      ATLAS_HTTP_ADDR: :8080
      ATLAS_TENANT_KEYS: ${ATLAS_TENANT_KEYS:?run make configure}
    ports: ["127.0.0.1:18081:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 15s
  worker:
    <<: *app
    command: [worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 10s

volumes:
  postgres_data:
