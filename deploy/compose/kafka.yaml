services:
  kafka:
    image: apache/kafka@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${ATLAS_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_MESSAGE_MAX_BYTES: 524288
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    ports: ["127.0.0.1:${ATLAS_KAFKA_PORT:-19092}:19092"]
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 8s
      retries: 30
    stop_grace_period: 20s
  worker:
    environment:
      ATLAS_MESSAGE_TRANSPORT: kafka
  broker-init:
    image: ddia-go-atlas:dev
    command: [broker-init]
    environment: &broker-environment
      ATLAS_DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:?run make configure}@postgres:5432/atlas_dev?sslmode=disable
      ATLAS_KAFKA_BROKERS: kafka:9092
      NO_PROXY: postgres,kafka,localhost,127.0.0.1
    depends_on:
      kafka: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  broker-publisher:
    image: ddia-go-atlas:dev
    command: [broker-publisher]
    environment: *broker-environment
    init: true
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      broker-init: {condition: service_completed_successfully}
    stop_grace_period: 10s
  broker-consumer:
    image: ddia-go-atlas:dev
    command: [broker-consumer]
    environment: *broker-environment
    init: true
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      broker-init: {condition: service_completed_successfully}
    stop_grace_period: 10s
volumes:
  kafka_data:
