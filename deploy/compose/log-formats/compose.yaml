name: ddia-go-log-formats
services:
  log-formats:
    image: postgres@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    pids_limit: 256
    mem_limit: 1g
    entrypoint: [/lab/log-formats-lab]
    command: [--pg-bin, /usr/lib/postgresql/18/bin, --workdir, /scratch, --output, /evidence/native.json]
    volumes:
      - ../../../artifacts/log-formats-binaries:/lab:ro
      - ../../../artifacts/log-formats:/evidence
    tmpfs:
      - "/scratch:size=1024m,mode=1777"
