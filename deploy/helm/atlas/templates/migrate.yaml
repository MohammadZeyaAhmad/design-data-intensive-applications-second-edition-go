apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-5'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: migration
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          args: [migrate]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            - name: ATLAS_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.credentials.migration }}, key: url}}
            - {name: ATLAS_TELEMETRY_ENABLED, value: 'false'}
            - {name: ATLAS_DURABLE_TRACE, value: 'false'}
          resources:
{{ toYaml .Values.resources | indent 12 }}
