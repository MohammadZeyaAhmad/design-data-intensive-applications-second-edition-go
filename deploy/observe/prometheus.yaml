global:
  scrape_interval: 1s
  evaluation_interval: 1s
rule_files: [/etc/prometheus/rules.yaml]
scrape_configs:
  - job_name: atlas-api
    authorization:
      credentials_file: /run/secrets/telemetry_token
    static_configs:
      - targets: [api:9090]
  - job_name: atlas-worker
    authorization:
      credentials_file: /run/secrets/telemetry_token
    static_configs:
      - targets: [worker:9090]
  - job_name: atlas-provider
    authorization:
      credentials_file: /run/secrets/telemetry_token
    static_configs:
      - targets: [provider:9090]
